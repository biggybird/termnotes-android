name: Build TermNotes APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Build did not produce a non-empty APK at $APK_PATH"
            exit 1
          fi
          echo "APK created: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TermNotes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
